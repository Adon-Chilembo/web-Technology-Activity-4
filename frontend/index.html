<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Product Showcase</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --text: #16202c; --muted: #5d6b7a;
    --line: #dde2e8; --accent: #0b6bcb; --accent-ink: #ffffff; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --surface: #1a212a; --text: #e8edf2; --muted: #93a1b0;
            --line: #2c3743; --accent: #5aa7f5; --accent-ink: #0b1620; --danger: #f2877f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 28px 20px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 48px;
         display: grid; gap: 20px; grid-template-columns: 340px 1fr; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  h2 { margin: 0 0 12px; font-size: 1.1rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 3px; }
  input, textarea { width: 100%; padding: 8px 10px; font: inherit; color: var(--text);
         background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--surface); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td small { color: var(--muted); display: block; }
  td.btns { white-space: nowrap; }
  #status { min-height: 1.4em; margin-top: 12px; font-size: .9rem; }
  #status.ok { color: var(--accent); } #status.err { color: var(--danger); }
  .empty { color: var(--muted); padding: 16px 0; }
</style>
</head>
<body>
<header>
  <h1>Tech Product Showcase</h1>
  <p>Add, edit and remove products. Changes are saved through the API.</p>
</header>

<main>
  <section aria-labelledby="form-title">
    <h2 id="form-title">Add a product</h2>
    <form id="product-form" novalidate>
      <input type="hidden" id="id">
      <label for="product_name">Product name *</label>
      <input id="product_name" maxlength="150" required>
      <div class="row">
        <div><label for="brand">Brand</label><input id="brand"></div>
        <div><label for="category">Category</label><input id="category"></div>
      </div>
      <div class="row">
        <div><label for="price">Price (USD) *</label><input id="price" type="number" min="0" step="0.01" required></div>
        <div><label for="stock_quantity">In stock</label><input id="stock_quantity" type="number" min="0" step="1" value="0"></div>
      </div>
      <label for="description">Description</label>
      <textarea id="description" rows="3"></textarea>
      <div class="actions">
        <button type="submit" id="save-btn" class="primary">Add product</button>
        <button type="button" id="cancel-btn" hidden>Cancel edit</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section aria-labelledby="list-title">
    <h2 id="list-title">Products <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Product</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden>No products yet. Add one using the form.</div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
